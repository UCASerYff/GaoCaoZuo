name: Windows native translation fixture

on:
  push:
    branches: ['codex/windows-translation-qa-*']

permissions:
  contents: read
  actions: read

jobs:
  synthetic-offline-translation:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the locked native test dependencies
        run: |
          $locked = Get-Content -LiteralPath requirements-dev.txt |
            Where-Object { $_ -match '^(pytest|Pillow|ctranslate2|sentencepiece|py3langid|setuptools)==' }
          if ($locked.Count -ne 6) { throw 'Missing locked translation test dependencies.' }
          python -m pip install --disable-pip-version-check --only-binary=:all: $locked
      - name: Verify the release-pinned native inference runtime
        run: |
          python -c 'import pkg_resources, ctranslate2, sentencepiece, py3langid; from importlib.metadata import version; assert callable(ctranslate2.Translator); assert ctranslate2.get_supported_compute_types("cpu"); print("CTranslate2", version("ctranslate2"), "setuptools", version("setuptools"), "native CPU inference available")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fetch and verify the two exact official Argos fixtures
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'src'
          $env:GAO_TRANSLATION_TEST_PACKS = Join-Path $env:RUNNER_TEMP 'gao-synthetic-argos-fixtures'
          @'
          import hashlib
          import os
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, build_opener

          from gaocaozuo.translation import NoRedirect
          from gaocaozuo.translation_models import PACKS

          folder = Path(os.environ["GAO_TRANSLATION_TEST_PACKS"])
          folder.mkdir()
          if {pack.pair for pack in PACKS} != {"en-zh", "zh-en"} or len(PACKS) != 2:
              raise RuntimeError("The expected fixture directions changed.")

          def download(pack):
              parsed = urlsplit(pack.url)
              expected_path = f"/argospm/v1/{pack.archive_name}"
              if (parsed.scheme, parsed.netloc, parsed.path, parsed.query, parsed.fragment) != (
                      "https", "data.argosopentech.com", expected_path, "", ""):
                  raise RuntimeError("Unexpected official fixture URL.")
              target = folder / pack.archive_name
              request = Request(pack.url, headers={"Accept": "application/octet-stream"})
              expected_digest = hashlib.sha256()
              count = 0
              with build_opener(NoRedirect()).open(request, timeout=60) as response, target.open("xb") as stream:
                  if int(response.headers["Content-Length"]) != pack.size:
                      raise RuntimeError("Official fixture length does not match the release pin.")
                  while content := response.read(1024 * 1024):
                      count += len(content)
                      if count > pack.size:
                          raise RuntimeError("Official fixture exceeds the release pin.")
                      expected_digest.update(content)
                      stream.write(content)
              if count != pack.size or expected_digest.hexdigest() != pack.digest:
                  raise RuntimeError("Official fixture does not match the release SHA-256.")
              print(f"{target.name}: {count} bytes, SHA-256 {pack.digest}", flush=True)

          with ThreadPoolExecutor(max_workers=2) as executor:
              list(executor.map(download, PACKS))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GAO_TRANSLATION_TEST_PACKS=$env:GAO_TRANSLATION_TEST_PACKS" >> $env:GITHUB_ENV
      - name: Run only the synthetic bidirectional offline inference test
        run: |
          if (!(Test-Path -LiteralPath $env:GAO_TRANSLATION_TEST_PACKS -PathType Container)) {
            throw 'Verified models are absent.'
          }
          python -m pytest -q -ra --showlocals -p no:cacheprovider tests/test_local_translation.py::test_native_translation_with_official_local_fixtures
      - name: Fetch the exact ec19dac Windows release-candidate artifact
        env:
          GAO_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactUri = 'https://api.github.com/repos/UCASerYff/GaoCaoZuo/actions/artifacts/15250322204'
          $headers = @{
            Authorization = "Bearer $env:GAO_ARTIFACT_READ_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $artifact = Invoke-RestMethod -Uri $artifactUri -Headers $headers -TimeoutSec 30
          if ($artifact.id -ne 15250322204 -or $artifact.expired -or $artifact.name -ne 'GaoCaoZuo-Windows-x64' -or
              $artifact.workflow_run.head_sha -ne 'ec19dac7c534f6a4cb77cc919a7df9410e7fb0fa') {
            throw 'The artifact is not the pinned Windows release candidate.'
          }
          $archiveSha = [regex]::Match([string]$artifact.digest, '^sha256:([a-f0-9]{64})$').Groups[1].Value
          if (!$archiveSha) { throw 'The workflow artifact is missing a SHA-256 digest.' }
          $folder = Join-Path $env:RUNNER_TEMP 'gao-exact-windows-candidate'
          $null = New-Item -ItemType Directory -Path $folder
          $zipPath = Join-Path $folder 'candidate.zip'
          # PowerShell drops Authorization on redirects to the artifact storage host.
          Invoke-WebRequest -Uri "$artifactUri/zip" -Headers $headers -OutFile $zipPath -TimeoutSec 180
          if ((Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash -ne $archiveSha) {
            throw 'Downloaded workflow artifact SHA-256 differs.'
          }
          $setupName = 'GaoCaoZuo-Windows-1.18-build3-x64-Setup.exe'
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($name in @($setupName, "$setupName.sha256")) {
              $entries = @($archive.Entries | Where-Object Name -eq $name)
              if ($entries.Count -ne 1) { throw "Missing or duplicate expected artifact entry: $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], (Join-Path $folder $name))
            }
          } finally {
            $archive.Dispose()
          }
          $setupPath = Join-Path $folder $setupName
          $sidecar = Get-Content -Raw -LiteralPath "$setupPath.sha256"
          $setupSha = [regex]::Match($sidecar, '(?i)^([a-f0-9]{64})(?:\s|$)').Groups[1].Value
          if (!$setupSha -or (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash -ne $setupSha) {
            throw 'Candidate installer SHA-256 differs from its sidecar.'
          }
          "GAO_CANDIDATE_SETUP=$setupPath" >> $env:GITHUB_ENV
          "Validated artifact $($artifact.id), installer SHA-256 $setupSha"
      - name: Exercise both native translation directions from installed candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'gao-isolated-translation-install'
          $install = Join-Path $root 'installed'
          $null = New-Item -ItemType Directory -Path $root
          $installerArgs = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /ISOLATEDSMOKE=1 /DIR="' + $install + '"'
          $process = Start-Process -FilePath $env:GAO_CANDIDATE_SETUP -ArgumentList $installerArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Isolated candidate installation exited $($process.ExitCode)." }
          $env:GAO_PACKAGED_CLI = Join-Path $install 'GaoCaoZuo-cli.exe'
          $file = Get-Item -LiteralPath $env:GAO_PACKAGED_CLI
          if ($file.VersionInfo.FileVersion -ne '1.18.3.0') { throw 'Unexpected installed CLI version.' }
          $env:APPDATA = (New-Item -ItemType Directory -Path (Join-Path $root 'roaming')).FullName
          $env:LOCALAPPDATA = (New-Item -ItemType Directory -Path (Join-Path $root 'local')).FullName
          @'
          import os
          from pathlib import Path
          import runpy
          import sys

          sys.path.insert(0, str(Path.cwd() / "src"))
          for key in ("PYTHONPATH", "PYTHONHOME", "TCL_LIBRARY", "TK_LIBRARY", "CONDA_PREFIX"):
              os.environ.pop(key, None)
          system = Path(os.environ["SystemRoot"])
          os.environ["PATH"] = os.pathsep.join((str(system / "System32"), str(system)))
          sys.argv = ["tests/packaged_translation_smoke.py", os.environ["GAO_PACKAGED_CLI"],
                      os.environ["GAO_TRANSLATION_TEST_PACKS"]]
          runpy.run_path(sys.argv[0], run_name="__main__")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
