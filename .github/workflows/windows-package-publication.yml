name: Validated Windows installer publication
on:
  push:
    branches: ['codex/windows-release-20261128-c3ee1ff8b5-hotfixpublish']
permissions:
  contents: write
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish the verified installer
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="${{ github.token }}"
          repo=UCASerYff/GaoCaoZuo
          tag=windows-v1.18-build.2
          source=c3ee1ff8b5530c48ca008dbf4ea959dbc4617616
          asset=GaoCaoZuo-Windows-1.18-build2-x64-Setup.exe
          work=$(mktemp -d)
          trap 'rm -f -- "$work/original.zip" "$work/$asset" "$work/$asset.sha256" "$work/notes.md"; rmdir -- "$work"' EXIT
          cd "$work"
          gh api "repos/$repo/actions/artifacts/15249242398/zip" > original.zip
          printf '%s  original.zip\n' '8d4cc6d38c2bd707d3fc87e91e8642d964f7e0a0dd8bc69ae83e74d464a58d1c' | sha256sum -c -
          for name in "$asset" "$asset.sha256"; do
            entry=$(unzip -Z1 original.zip | awk -F/ -v name="$name" '$NF == name {print $0}')
            test -n "$entry"
            test "$(printf '%s\n' "$entry" | wc -l)" -eq 1
            unzip -p original.zip "$entry" > "$name"
          done
          sha256sum -c "$asset.sha256"
          test "$(gh api "repos/$repo/commits/main" --jq .sha)" = "$source"
          test "$(gh api "repos/$repo/releases?per_page=100" --jq 'map(select(.tag_name == "windows-v1.18-build.2")) | length')" -eq 0
          cat <<'NOTES' > notes.md
          修复首次使用或只有已迁移换装资料时，已勾选快捷方式并分配角色后仍无法点击「批量换装」的问题。保留已有图标和恢复记录。
          
          附 SHA-256 校验文件。
          NOTES
          gh release create "$tag" "$asset" "$asset.sha256" --repo "$repo" --target "$source" --title "GaoCaoZuo Windows 1.18 (build 2)" --notes-file notes.md --draft --latest=false
          draft=$(gh api "repos/$repo/releases?per_page=100" --jq '.[] | select(.tag_name == "windows-v1.18-build.2" and .draft).id')
          test -n "$draft"
          test "$(gh api "repos/$repo/releases/$draft" --jq .target_commitish)" = "$source"
          test "$(gh api "repos/$repo/releases/$draft/assets" --jq length)" -eq 2
          for name in "$asset" "$asset.sha256"; do
            hash=$(sha256sum "$name" | cut -d ' ' -f1)
            bytes=$(wc -c < "$name" | tr -d ' ')
            metadata=$(gh api "repos/$repo/releases/$draft/assets" | jq -r --arg name "$name" '.[] | select(.name == $name and .state == "uploaded") | .digest + "/" + (.size | tostring)')
            test "$metadata" = "sha256:$hash/$bytes"
          done
          gh api -X PATCH "repos/$repo/releases/$draft" -F draft=false -f make_latest=false --jq .html_url
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha)" = "$source"
