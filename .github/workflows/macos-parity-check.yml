name: macOS parity validation
on:
  push:
    branches: ['codex/macos-parity-verify-20261127-5c576feaab-r2']
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run focused macOS checks
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          export DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer
          test -x "$DEVELOPER_DIR/usr/bin/xcodebuild"
          xcodebuild -version
          check_script=Scripts/.candidate-tests-only.sh
          trap 'rm -f -- "$check_script"' EXIT
          sed '/^\/bin\/zsh .*build\.sh.*--compile-only$/d' Scripts/verify-macos.sh > "$check_script"
          test "$(wc -l < Scripts/verify-macos.sh)" -eq "$(( $(wc -l < "$check_script") + 1 ))"
          bash "$check_script"
