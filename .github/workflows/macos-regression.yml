name: macOS full safe regression
on:
  push:
    branches: ['codex/macos-regression-20261128-c3ee1ff8-full']
permissions:
  contents: read
jobs:
  production:
    name: Production compile and targeted regressions
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Production compile and synthetic action, alias, OCR, input and archive checks
        run: bash Scripts/verify-macos.sh
  suites:
    name: Isolated ${{ matrix.suite }}
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        suite: [full, extensions, archive-safety, input, desktop-lock]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute isolated product test entry
        shell: bash
        env:
          GAO_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          project=$(pwd -P)
          /usr/bin/python3 -B "$project/Scripts/setup-workspace-leases.py"
          lease="$(dirname -- "$project")/合并迁移-2026-11-02/build_lease.py"
          export GAO_BUILD_LEASE_OWNER="macos-regression-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
          receipt=$(/usr/bin/python3 -B "$lease" acquire --owner "$GAO_BUILD_LEASE_OWNER" --purpose 'Run isolated macOS synthetic regression')
          GAO_BUILD_LEASE_TOKEN=$(/usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$receipt")
          export GAO_BUILD_LEASE_TOKEN
          trap '/usr/bin/python3 -B "$lease" release >/dev/null' EXIT
          case "$GAO_SUITE" in
            full) /bin/zsh Scripts/test.sh ;;
            extensions) /bin/zsh Scripts/test.sh --swift-only --extensions-only ;;
            archive-safety) /bin/zsh Scripts/test.sh --swift-only --archive-safety-only ;;
            input) /bin/zsh Scripts/test.sh --swift-only --input-targeted-only ;;
            desktop-lock) /bin/zsh Scripts/test.sh --swift-only --desktop-lock-integration-only ;;
            *) exit 2 ;;
          esac
