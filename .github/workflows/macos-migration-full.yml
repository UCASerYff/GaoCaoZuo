name: macOS migration and full regression recheck
on:
  push:
    branches: ['codex/macos-migration-full-20261128-c3ee1ff8']
permissions:
  contents: read
jobs:
  full:
    name: Full isolated macOS test entry
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute leased default test entry
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          project=$(pwd -P)
          /usr/bin/python3 -B "$project/Scripts/setup-workspace-leases.py"
          lease="$(dirname -- "$project")/合并迁移-2026-11-02/build_lease.py"
          export GAO_BUILD_LEASE_OWNER="macos-migration-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$$"
          receipt=$(/usr/bin/python3 -B "$lease" acquire --owner "$GAO_BUILD_LEASE_OWNER" --purpose 'Run the isolated default macOS regression')
          GAO_BUILD_LEASE_TOKEN=$(/usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$receipt")
          export GAO_BUILD_LEASE_TOKEN
          trap '/usr/bin/python3 -B "$lease" release >/dev/null' EXIT
          /bin/zsh Scripts/test.sh
