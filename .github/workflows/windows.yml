name: Windows

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test and build executables
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1
      - name: Smoke-test the packaged exe
        run: |
          $ErrorActionPreference = "Stop"
          $dest = Join-Path $env:TEMP ("gaocaozuo-smoke-" + [guid]::NewGuid().ToString("n"))
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $settings = Join-Path $dest "settings.json"
          if (Test-Path $settings) { throw "temp data dir already has settings.json" }
          $port = 18771
          $exe = Join-Path (Get-Location) "dist\GaoCaoZuo.exe"
          $started = Get-Date
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "--data-dir", $dest, "--serve", "--no-browser", "--port", "$port"
          ) -PassThru -WindowStyle Hidden
          try {
            $page = $null
            $deadline = (Get-Date).AddSeconds(90)
            do {
              if ($proc.HasExited) { throw "GaoCaoZuo.exe exited early with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 3 -NoProxy
                if ($response.StatusCode -eq 200) { $page = $response; break }
              } catch {}
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)
            if (-not $page) { throw "packaged exe did not return HTTP 200" }
            $token = [regex]::Match($page.Content, 'name="gao-token" content="([^"]+)"').Groups[1].Value
            if (-not $token) { throw "HTTP 200 page did not include a session token" }
            $headers = @{ "X-Gao-Token" = $token }
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/settings/create" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            if (-not (Test-Path $settings)) { throw "creating settings did not write settings.json" }
            $out = Join-Path $dest "out"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $body = @{ id = "new.text"; payload = @{ directory = $out } } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/action" -Headers $headers -ContentType "application/json; charset=utf-8" -Body $body -NoProxy | Out-Null
            $created = Get-ChildItem -Path $out -Filter "*.txt"
            if (-not $created) { throw "new text action did not create a file" }
            Start-Sleep -Seconds 3
            if ($proc.HasExited) { throw "GaoCaoZuo.exe exited during the smoke window" }
            if (((Get-Date) - $started).TotalSeconds -lt 3) { throw "packaged exe did not stay running for several seconds" }
            Write-Output "smoke ok: HTTP 200, wrote settings.json and a text file"
            try {
              Invoke-RestMethod -Method POST -Uri "http://127.0.0.1:$port/api/shutdown" -Headers $headers -ContentType "application/json" -Body "{}" -NoProxy | Out-Null
            } catch {}
            $exitDeadline = (Get-Date).AddSeconds(20)
            while (-not $proc.HasExited -and (Get-Date) -lt $exitDeadline) { Start-Sleep -Milliseconds 500 }
            if (-not $proc.HasExited) { throw "GaoCaoZuo.exe did not exit after shutdown" }
          } finally {
            if (-not $proc.HasExited) { & taskkill.exe /PID $proc.Id /T /F | Out-Null }
            if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GaoCaoZuo-Windows-1.16
          if-no-files-found: error
          path: |
            windows/dist/GaoCaoZuo.exe
            windows/dist/GaoCaoZuo-cli.exe
