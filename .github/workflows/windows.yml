name: Windows

on:
  push:
    paths: ['windows/**', 'Assets/AppIcon.png', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'Assets/AppIcon.png', '.github/workflows/windows.yml']

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare Inno Setup compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path (Get-Location).Path 'build'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $setup = Join-Path $root 'innosetup-6.7.3.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') {
              throw 'Inno Setup checksum differs.'
          }
          $path = Join-Path $root 'inno'
          $arguments = '/PORTABLE=1 /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR="' + $path + '"'
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup compiler exited $($process.ExitCode)." }
      - name: Test and package x64
        run: .\build.ps1 -InnoCompiler (Join-Path (Get-Location).Path 'build\inno\ISCC.exe')
      - name: Smoke-test the installed app
        run: .\smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GaoCaoZuo-Windows-1.16-x64
          if-no-files-found: error
          path: |
            windows/dist/GaoCaoZuo-Windows-1.16-x64-Setup.exe
            windows/dist/GaoCaoZuo-Windows-1.16-x64-Setup.exe.sha256
